<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EyeNav</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
</head>

<body>
    <div class="container">
        <main>
            <div id="mode-chooser" class="mode-chooser">
                <div class="mode-chooser-icon">
                    <img src="../assets/logo-light.png" alt="Accessibility Icon" />
                </div>
                <h1 id="mode-chooser-title" class="mode-chooser-title"></h1>
                <p id="eyenav-choose-mode" class="choose-mode-text"></p>

                <button id="mode-eye-voice" class="mode-button" type="button">
                    <span class="mode-button-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </span>
                    <span class="mode-button-text">
                        <span id="eyenav-mode-eye-voice-title" class="mode-button-title"></span>
                        <span id="eyenav-mode-eye-voice-subtitle" class="mode-button-subtitle"></span>
                    </span>
                </button>

                <button id="mode-mouse-keyboard" class="mode-button" type="button">
                    <span class="mode-button-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="6" y="3" width="12" height="18" rx="6" />
                            <line x1="12" y1="3" x2="12" y2="10" />
                        </svg>
                    </span>
                    <span class="mode-button-text">
                        <span id="eyenav-mode-mouse-keyboard-title" class="mode-button-title"></span>
                        <span id="eyenav-mode-mouse-keyboard-subtitle" class="mode-button-subtitle"></span>
                    </span>
                </button>
            </div>

            <div id="eye-voice-notice" class="mode-chooser" hidden>
                <div class="mode-chooser-icon">
                    <img src="../assets/logo-light.png" alt="Accessibility Icon" />
                </div>
                <h1 id="eye-voice-notice-title" class="mode-chooser-title"></h1>
                <p id="eyenav-eye-voice-active" class="choose-mode-text"></p>
                <button id="open-side-panel-button" class="mode-button" type="button">
                    <span class="mode-button-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </span>
                    <span class="mode-button-text">
                        <span id="eyenav-open-side-panel" class="mode-button-title"></span>
                    </span>
                </button>
            </div>

            <p id="mode-error" class="mode-error" hidden></p>

            <div id="panel-content" hidden>
                <div class="mode-chooser-icon">
                    <img src="../assets/logo-light.png" alt="Accessibility Icon" />
                </div>
                <h1 id="panel-content-title" class="mode-chooser-title"></h1>
                <p id="alert-below-button" class="choose-mode-text"></p>

                <div class="start-session">
                    <button id="play-button" class="play-button play" aria-label="Start session">
                        <span aria-hidden="true">&#9658;</span>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="../shared/panel.js"></script>
    <script src="popup.js"></script>
</body>

</html>
